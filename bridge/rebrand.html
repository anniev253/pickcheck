.wrap{max-width:880px;margin:0 auto}

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
let STATE = JSON.parse(document.getElementById('state').textContent);
let readOnly = false, filter = 'all', me = '';
try { filter = localStorage.getItem('rebrand-filter') || 'all'; me = localStorage.getItem('rebrand-me') || ''; } catch (e) {}
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const isDone = id => !!(STATE.done && STATE.done[id]);
const doneNote = id => { const d = STATE.done && STATE.done[id]; return d ? 'Done ' + esc(d.at || '') + (d.by ? ' by ' + esc(d.by) : '') : ''; };
function counts() {
  const centralDone = DATA.central.filter(c => isDone('central:' + c.id)).length;
  const swapped = DATA.stores.filter(s => isDone('swapped:' + s.id)).length;
  return { centralDone, swapped, total: DATA.central.length + DATA.stores.length, done: centralDone + swapped };
}
function render() {
  const c = counts();
  const pct = Math.round(100 * c.done / c.total);
  const visible = DATA.stores.filter(s => filter === 'all' ? true : filter === 'open' ? !isDone('swapped:' + s.id) : s.rep === filter);
  const chains = {}; for (const s of DATA.stores) if (s.chain) { chains[s.chain] = chains[s.chain] || new Set(); s.contact.forEach(e => chains[s.chain].add(e)); }
  const chainList = Object.entries(chains).map(([k, v]) => '<b>' + esc(k) + '</b> (' + DATA.stores.filter(s => s.chain === k).length + ' stores): ' + [...v].slice(0, 3).map(esc).join(', ')).join('<br>');
  const dis = readOnly ? ' disabled' : '';
  document.getElementById('app').innerHTML = '<div class="wrap">' +
    '<header class="top"><div class="topline"><div><div class="eyebrow">Oleum Extracts rebrand</div><h1>Rebrand Photo Swap</h1></div>' + (typeof SITE_LINKS === 'string' ? SITE_LINKS : '') + '</div>' +
    '<div class="progress"><div class="bar"><i style="width:' + pct + '%"></i></div><span class="pnum">' + c.done + ' of ' + c.total + ' done (' + c.centralDone + '/' + DATA.central.length + ' platform fixes, ' + c.swapped + '/' + DATA.stores.length + ' stores swapped)</span></div>' +
    '<div class="me"><label for="me">Your name (shown next to your ticks)</label><input id="me" value="' + esc(me) + '" placeholder="Justin"></div>' +
    (readOnly ? '<div class="ro">This view is read-only.</div>' : '') + '</header>' +
    '<p class="lede">Everything the audit found still showing the old yellow badge, and who fixes it. Tick a box and it saves for everyone. Built from the ' + esc(DATA.built) + ' audit.</p>' +
    '<div class="stats"><div class="stat"><b>' + DATA.totals.items.toLocaleString() + '</b><span>old-logo menu items found</span></div><div class="stat"><b>' + DATA.totals.central.toLocaleString() + '</b><span>fixed by the platform steps in section 1</span></div><div class="stat"><b>' + DATA.totals.own.toLocaleString() + '</b><span>photos stores must swap themselves</span></div><div class="stat"><b>' + DATA.stores.length + '</b><span>stores on the swap list</span></div></div>' +
    '<section id="platforms"><div class="sec-head"><h2>1. Platform and brand fixes</h2><p>Do these first. They clear ' + Math.round(100 * DATA.totals.central / DATA.totals.items) + '% of the old images at once.</p></div>' +
    DATA.central.map(t => { const id = 'central:' + t.id, d = isDone(id); return '<div class="task' + (d ? ' done' : '') + '"><input type="checkbox" id="cb-' + t.id + '" data-id="' + id + '"' + (d ? ' checked' : '') + dis + '><div><label for="cb-' + t.id + '"><span class="t">' + esc(t.title) + '</span><span class="o">' + esc(t.owner) + '</span></label><p>' + esc(t.body) + (t.link ? ' <a href="' + esc(t.link) + '" target="_blank" rel="noopener">Open</a>' : '') + '</p>' + (d ? '<p class="pnum">' + doneNote(id) + '</p>' : '') + '</div></div>'; }).join('') + '</section>' +
    '<section id="stores"><div class="sec-head"><h2>2. Stores that uploaded their own old photos</h2><p>Send the pack, then check the menu and tick Swapped.</p></div>' +
    '<div class="chain-note">Chains first: one conversation covers several rows.<br>' + chainList + '</div>' +
    '<div class="filters" role="group" aria-label="Show">' + [['all', 'All'], ['Justin', 'Justin'], ['Nate', 'Nate'], ['open', 'Still open']].map(([k, l]) => '<button class="chip" data-filter="' + k + '" aria-pressed="' + (filter === k) + '">' + l + '</button>').join('') + '</div>' +
    (visible.length ? visible.map(s => { const sw = isDone('swapped:' + s.id), se = isDone('sent:' + s.id); return '<div class="store' + (sw ? ' swapped' : '') + '">' +
      '<div><div class="name"><span class="rep">' + esc(s.rep) + '</span>' + esc(s.account) + (s.chain ? '<small>' + esc(s.chain) + '</small>' : '') + (s.suspect ? ' <span class="warn">check this is the right store</span>' : '') + '</div>' +
      '<div class="where">' + s.listings.map(l => esc(l.name) + ': ' + l.n + ' old photo' + (l.n > 1 ? 's' : '') + ' <a href="' + esc(l.url) + '" target="_blank" rel="noopener">view menu</a>').join(' &middot; ') + (s.central ? ' &middot; <span class="pnum">' + s.central + ' more clear with the platform fixes</span>' : '') + '</div>' +
      '<div class="who">' + (s.contact.length ? s.contact.map(e => '<code>' + esc(e) + '</code>').join('') + '<button class="copy" data-copy="' + esc(s.contact.join(', ')) + '">copy</button>' : '<span>no email on file in Cultivera</span>') + (sw || se ? '<span>' + (se ? doneNote('sent:' + s.id).replace('Done', 'Sent') : '') + (sw ? (se ? ' &middot; ' : '') + doneNote('swapped:' + s.id).replace('Done', 'Swapped') : '') + '</span>' : '') + '</div></div>' +
      '<div class="checks"><label><input type="checkbox" data-id="sent:' + s.id + '"' + (se ? ' checked' : '') + dis + '>Pack sent</label><label><input type="checkbox" data-id="swapped:' + s.id + '"' + (sw ? ' checked' : '') + dis + '>Swapped</label></div></div>'; }).join('') : '<p class="pnum">Nothing left in this view.</p>') + '</section>' +
    '<section id="also"><div class="sec-head"><h2>3. Also worth knowing</h2></div>' +
    '<details><summary>' + DATA.centralOnly.length + ' more accounts show the old logo only through platform images (no store action needed)</summary><ul class="small-list">' + DATA.centralOnly.map(a => '<li>' + esc(a.account) + ' <span class="pnum">' + esc(a.rep) + ', ' + a.n + '</span></li>').join('') + '</ul></details>' +
    '<details><summary>' + DATA.outside.length + ' stores with old photos that are not in the active account list</summary><ul class="small-list">' + DATA.outside.map(o => '<li>' + esc(o.name) + ' (' + esc(o.city) + ') on ' + esc(o.platform) + ': ' + o.n + ' <a href="' + esc(o.url) + '" target="_blank" rel="noopener">view</a></li>').join('') + '</ul></details>' +
    '</section><footer>Source: Rebrand Audit, ' + esc(DATA.built) + '. Re-running the audit regenerates the lists; ticks are kept.</footer></div>' +
    '<div class="status" id="status" hidden>Saving</div>';
}
function setTick(id, checked) {
  STATE.done = STATE.done || {};
  if (checked) STATE.done[id] = { at: new Date().toISOString().slice(0, 10), by: me }; else delete STATE.done[id];
}
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'me') { me = el.value.trim().slice(0, 40); try { localStorage.setItem('rebrand-me', me); } catch (x) {} return; }
  if (!(el instanceof HTMLInputElement) || !el.dataset.id) return;
  setTick(el.dataset.id, el.checked); render(); persist(el.dataset.id, el.checked);
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.filter) { filter = b.dataset.filter; try { localStorage.setItem('rebrand-filter', filter); } catch (x) {} render(); }
  if (b.dataset.copy) { const t = b.dataset.copy; const ok = () => { b.textContent = 'copied'; setTimeout(() => b.textContent = 'copy', 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, () => { const r = document.createRange(); r.selectNodeContents(b.parentElement); getSelection().removeAllRanges(); getSelection().addRange(r); }); }
});

const SITE_LINKS = '<a href="/">Pick app</a>';
async function api(method, body) {
  const r = await fetch('/api/rebrand', { method, credentials: 'same-origin', headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { gate(); throw new Error('sign in'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function gate(msg) {
  document.getElementById('app').innerHTML = '<div class="gate"><div class="eyebrow">Oleum Orders</div><h2>Rebrand Photo Swap</h2><p>Enter the team password to open the checklist.</p><input id="pw" type="password" autocomplete="current-password" placeholder="Password"><div class="err" id="err">' + esc(msg || '') + '</div><button id="go">Open</button></div>';
  const go = async () => {
    const pw = document.getElementById('pw').value;
    const r = await fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: pw }) });
    if (!r.ok) { document.getElementById('err').textContent = 'Wrong password.'; return; }
    load();
  };
  document.getElementById('go').onclick = go;
  document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') go(); };
  document.getElementById('pw').focus();
}
async function load() {
  try { STATE = await api('GET'); render(); } catch (e) {}
}
async function persist(id, done) {
  const st = document.getElementById('status'); st.hidden = false; st.textContent = 'Saving';
  try { STATE = await api('POST', { id, done, by: me }); render(); }
  catch (e) { if (document.getElementById('status')) { document.getElementById('status').textContent = 'Could not save, check your connection'; } return; }
  document.getElementById('status').hidden = true;
}
render();          // draw at once from the built-in empty state, then fetch the shared ticks
load();
setInterval(() => { if (!document.hidden) load(); }, 30000);   // pick up other people's ticks
</script>
